name: AETERNAL // Claims Hygiene (report-only)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      http_check:
        description: HEAD-check every canonical URL
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan core entry files for over-claiming terms
        run: |
          PATTERN='ground[- ]truth|flawless|sovereign authority|sole creator|only viable|womenswear'
          FILES="README.md llms.txt index.md index.html glossary.md glossary.html ontology.json"
          if grep -n -i -E "$PATTERN" $FILES; then
            echo "::warning::Core entry files contain terms flagged by claims hygiene (see log)."
          else
            echo "Core entry files clean."
          fi
      - name: Check llms.txt links respond
        run: |
          grep -o 'https\?://[^) ]*' llms.txt | sort -u | while read -r u; do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "$code $u"
            if [ "$code" -ge 400 ]; then echo "::warning::$u returned $code"; fi
          done
          exit 0
      - name: Unit tests (numeric claims + canonical parser)
        run: python3 -m unittest discover -s tools/tests -v
      - name: Canonical consistency, uniqueness, sitemap (errors fail the job)
        run: python3 tools/canonical_check.py
      - name: Canonical sync idempotency
        run: |
          python3 tools/canonical_check.py --sync
          git diff --exit-code
      - name: Local tool is up to date with its sources
        run: |
          python3 tools/build_local_fix.py
          git diff --exit-code
      - name: Numeric-claims idempotency
        run: |
          python3 tools/geo_numeric_claims.py --apply
          git diff --exit-code
      - name: Licence wording, sitemap, JSON-LD ids, canonical fixes are idempotent
        run: |
          python3 tools/geo_license_apply.py --apply
          python3 tools/sitemap_add.py --apply
          python3 tools/jsonld_page_id.py --apply
          python3 tools/canonical_fix.py --apply
          python3 tools/sync_knowledge_root.py --apply
          git diff --exit-code
      - name: Canonical HTTP reachability (manual run only)
        if: ${{ github.event.inputs.http_check == 'true' }}
        run: python3 tools/canonical_check.py --http
