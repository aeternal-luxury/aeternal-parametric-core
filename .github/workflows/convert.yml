name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert ALL HTML to MD (force overwrite) with aggressive cleaning
        run: |
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            MD_FILE="${1%.html}.md"
            echo "Converting $1 (overwriting $MD_FILE)..."
            
            REL_PATH=$(echo "${1#./}" | sed "s/\.html$//")
            BASE_URL="https://knowledge.aeternal-luxury.com/"
            CANONICAL_URL="$BASE_URL/$REL_PATH"
            
            # 1. 使用 Pandoc 轉為純 Markdown（去除 raw HTML）
            pandoc "$1" -f html -t markdown-raw_html --wrap=none -o temp.md
            
            # 2. 修復被轉義的 \$
            sed -i "s/\\\\\\$/\\$/g" temp.md
            
            # 3. 移除所有 {屬性}（包括 {#id .class style="..."} 等）
            perl -pi -e "s/\\s*{[^}]*}//g" temp.md
            
            # 4. 刪除以 ::: 開頭的 fenced div 標記行
            sed -i "/^:::/d" temp.md
            
            # 5. 清除可能殘留的 HTML 標籤（例如 <div>, <span> 等）
            # 注意：Pandoc 已移除大部分，但極少數可能殘留，用此指令補強
            perl -pi -e "s/<[^>]+>//g" temp.md
            
            # 6. 壓縮多餘空行（只保留一個空行）
            sed -i "/^$/N;/^\\n$/D" temp.md
            
            # 7. 構建最終 MD（加入 YAML 和宣告）
            echo "---" > "$MD_FILE"
            echo "title: \"Aeternal Luxury Parametric Asset\"" >> "$MD_FILE"
            echo "canonical: \"$CANONICAL_URL\"" >> "$MD_FILE"
            echo "---" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            echo "> 🌐 **Sovereign Node**: This is an AI-readable mirror repository. The canonical live version is deployed at: [$CANONICAL_URL]($CANONICAL_URL)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            cat temp.md >> "$MD_FILE"
            rm temp.md
          ' _ {} \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Clean Markdown with attributes and divs removed"
          branch: main
          options: '--strategy-option theirs'
