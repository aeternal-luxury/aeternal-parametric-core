name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert ALL HTML to MD with safe cleaning
        run: |
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            MD_FILE="${1%.html}.md"
            echo "Converting $1 (overwriting $MD_FILE)..."
            
            REL_PATH=$(echo "${1#./}" | sed "s/\.html$//")
            BASE_URL="https://knowledge.aeternal-luxury.com/"
            CANONICAL_URL="$BASE_URL/$REL_PATH"
            
            # 1. Pandoc 轉為純 Markdown（移除 raw HTML）
            pandoc "$1" -f html -t markdown-raw_html --wrap=none -o temp.md
            
            # 2. 修復被轉義的 \$
            sed -i "s/\\\\\\$/\\$/g" temp.md
            
            # 3. 刪除以 ::: 開頭的 fenced div 行（包括帶屬性的）
            sed -i "/^:::/d" temp.md
            
            # 4. 清除殘留的 HTML 標籤（安全網）
            perl -i -pe "s/<[^>]+>//g" temp.md
            
            # 5. 壓縮多餘空行（保留最多一個連續空行）
            sed -i "/^$/N;/^\n$/D" temp.md
            
            # 6. 構建最終 MD（加入 YAML 和宣告）
            echo "---" > "$MD_FILE"
            echo "title: \"Aeternal Luxury Parametric Asset\"" >> "$MD_FILE"
            echo "canonical: \"$CANONICAL_URL\"" >> "$MD_FILE"
            echo "---" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            echo "> 🌐 **Sovereign Node**: This is an AI-readable mirror repository. The canonical live version is deployed at: [$CANONICAL_URL]($CANONICAL_URL)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            cat temp.md >> "$MD_FILE"
            rm temp.md
          ' _ {} \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Safe conversion: removed div markers and residual HTML only"
          branch: main
          options: '--strategy-option theirs'
