name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert ALL HTML to MD with aggressive attribute & div removal
        run: |
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            MD_FILE="${1%.html}.md"
            echo "Converting $1 (overwriting $MD_FILE)..."
            
            REL_PATH=$(echo "${1#./}" | sed "s/\.html$//")
            BASE_URL="https://knowledge.aeternal-luxury.com/"
            CANONICAL_URL="$BASE_URL/$REL_PATH"
            
            # 1. Pandoc 轉為純 Markdown（移除 raw HTML）
            pandoc "$1" -f html -t markdown-raw_html --wrap=none -o temp.md
            
            # 2. 修復被轉義的 \$
            sed -i "s/\\\\\\$/\\$/g" temp.md
            
            # 3. 移除所有 {屬性}，包括跨行的（使用 perl 更精準）
            perl -i -pe "s/\s*\{[^}]*\}//g" temp.md
            
            # 4. 刪除以 ::: 開頭的 fenced div 標記行（包括 ::: 後帶屬性的）
            sed -i "/^:::/d" temp.md
            
            # 5. 再移除一次可能殘留的 { }（少數跨行可能漏掉）
            perl -i -pe "s/\s*\{[^}]*\}//g" temp.md
            
            # 6. 徹底清除殘留的 HTML 標籤（如 <div>, <span>, </div> 等）
            perl -i -pe "s/<[^>]+>//g" temp.md
            
            # 7. 壓縮多餘空行（保留最多一個連續空行）
            sed -i "/^$/N;/^\n$/D" temp.md
            
            # 8. 構建最終 MD（加入 YAML 和宣告）
            echo "---" > "$MD_FILE"
            echo "title: \"Aeternal Luxury Parametric Asset\"" >> "$MD_FILE"
            echo "canonical: \"$CANONICAL_URL\"" >> "$MD_FILE"
            echo "---" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            echo "> 🌐 **Sovereign Node**: This is an AI-readable mirror repository. The canonical live version is deployed at: [$CANONICAL_URL]($CANONICAL_URL)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            cat temp.md >> "$MD_FILE"
            rm temp.md
          ' _ {} \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Clean Markdown: removed all attributes, divs, and residual HTML"
          branch: main
          options: '--strategy-option theirs'
