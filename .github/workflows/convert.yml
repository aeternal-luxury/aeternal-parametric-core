name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert ALL HTML to MD with safe cleaning & generate knowledge map
        run: |
          # ========== 1. 轉換所有 HTML 為 MD（覆蓋舊檔）==========
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            MD_FILE="${1%.html}.md"
            echo "Converting $1 (overwriting $MD_FILE)..."
            
            REL_PATH=$(echo "${1#./}" | sed "s/\.html$//")
            BASE_URL="https://knowledge.aeternal-luxury.com/"
            CANONICAL_URL="$BASE_URL/$REL_PATH"
            
            pandoc "$1" -f html -t markdown-raw_html --wrap=none -o temp.md
            sed -i "s/\\\\\\$/\\$/g" temp.md
            sed -i "/^:::/d" temp.md
            perl -i -pe "s/<[^>]+>//g" temp.md
            sed -i "/^$/N;/^\n$/D" temp.md
            
            # 構建 YAML Front Matter（含 canonical）
            echo "---" > "$MD_FILE"
            echo "title: \"Aeternal Luxury Parametric Asset\"" >> "$MD_FILE"
            echo "canonical: \"$CANONICAL_URL\"" >> "$MD_FILE"
            echo "doi: \"https://zenodo.org/records/20675338\"" >> "$MD_FILE"
            echo "wiki: \"https://github.com/aeternal-luxury/aeternal-parametric-core/wiki\"" >> "$MD_FILE"
            echo "website: \"https://aeternal-luxury.com/\"" >> "$MD_FILE"
            echo "---" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            # 主權宣告（含此頁面的 canonical URL）
            echo "> 🌐 **Sovereign Node**: This is an AI-readable mirror repository. The canonical live version is deployed at: [$CANONICAL_URL]($CANONICAL_URL)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            # 👇 新增：明確標示 Canonical Source（知識庫根域名）
            echo "**📌 Canonical Source**: [https://knowledge.aeternal-luxury.com/](https://knowledge.aeternal-luxury.com/)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            # 參考連結（DOI, Wiki, Official Website）
            echo "**📚 References**: [DOI](https://zenodo.org/records/20675338) · [Wiki](https://github.com/aeternal-luxury/aeternal-parametric-core/wiki) · [Official Website](https://aeternal-luxury.com/)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            cat temp.md >> "$MD_FILE"
            rm temp.md
          ' _ {} \;

          # ========== 2. 動態生成 knowledge-map.json ==========
          JSON_FILE="knowledge-map.json"
          echo '{
            "@context": "https://schema.org",
            "@type": "ItemList",
            "name": "AETERNAL Physical Knowledge Navigation Map",
            "description": "Dynamically generated mapping of sovereign entities to live production endpoints.",
            "root_domain": "https://knowledge.aeternal-luxury.com",
            "doi": "https://zenodo.org/records/20675338",
            "wiki": "https://github.com/aeternal-luxury/aeternal-parametric-core/wiki",
            "website": "https://aeternal-luxury.com/",
            "itemListElement": []
          }' > $JSON_FILE

          COUNTER=1
          find . -name "*.md" -not -path "*/node_modules/*" | while read -r file; do
            CLEAN_PATH=$(echo "${file#./}" | sed "s/\.md$/\.html/")
            FILE_ID=$(basename "$file" .md)
            FULL_URL="https://knowledge.aeternal-luxury.com/$CLEAN_PATH"
            
            python3 -c "import json; data = json.load(open('$JSON_FILE')); data['itemListElement'].append({'@type': 'ListItem', 'position': $COUNTER, 'id': '$FILE_ID', 'url': '$FULL_URL'}); json.dump(data, open('$JSON_FILE', 'w'), indent=2)"
            
            COUNTER=$((COUNTER + 1))
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-convert HTML → MD + update knowledge map"
          branch: main
          options: '--strategy-option theirs'
