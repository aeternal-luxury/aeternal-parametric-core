name: Convert HTML to Markdown
on:
  push:
    paths:
      - '**.html'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 關鍵：賦予 Action 寫入倉庫的權限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 更新為 v4 以兼容 Node 24

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert HTML to MD
        run: |
          find . -name "*.html" -exec sh -c 'pandoc "$1" -f html -t markdown-raw_html -o "${1%.html}.md"' _ {} \;

      - name: Commit and Push changes
        run: |
          git config --global user.name 'AETERNAL-Bot'
          git config --global user.email 'bot@aeternal-luxury.com'
          git add *.md */*.md
          # 檢查是否有變更，有的話才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-convert: Sync HTML to MD" && git push)
