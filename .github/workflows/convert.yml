name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:   # 允許手動觸發（方便一次性補轉所有缺失）

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert missing HTML to MD
        run: |
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            if [ ! -f "${1%.html}.md" ]; then
              echo "Converting $1 ..."
              pandoc "$1" -f html -t markdown-raw_html -o "${1%.html}.md"
            fi
          ' _ {} \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-convert missing HTML to Markdown"
          branch: main
          options: '--strategy-option theirs'   # 衝突時採用本地
