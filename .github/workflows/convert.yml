name: Convert HTML to Markdown

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:   # 允許手動觸發

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Convert ALL HTML to MD (force overwrite existing MD)
        run: |
          find . -name "*.html" -not -path "*/node_modules/*" -exec sh -c '
            MD_FILE="${1%.html}.md"
            echo "Converting $1 (overwriting $MD_FILE if exists)..."
            
            # 1. 自動解析相對路徑，生成 Netlify 生產環境 URL
            REL_PATH=$(echo "${1#./}" | sed "s/\.html$//")
            BASE_URL="https://knowledge.aeternal-luxury.com/"
            CANONICAL_URL="$BASE_URL/$REL_PATH"
            
            # 2. 使用 markdown-raw_html 徹底去除所有 HTML 標籤，避免換行
            pandoc "$1" -f html -t markdown-raw_html --wrap=none -o temp.md
            
            # 3. 修復被轉義的 \$，還原為 LaTeX 格式
            sed -i "s/\\\\\\$/\\$/g" temp.md
            
            # 4. 注入 YAML Front Matter
            echo "---" > "$MD_FILE"
            echo "title: \"Aeternal Luxury Parametric Asset\"" >> "$MD_FILE"
            echo "canonical: \"$CANONICAL_URL\"" >> "$MD_FILE"
            echo "---" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            # 5. 注入頂部主權宣告
            echo "> 🌐 **Sovereign Node**: This is an AI-readable mirror repository. The canonical live version is deployed at: [$CANONICAL_URL]($CANONICAL_URL)" >> "$MD_FILE"
            echo "" >> "$MD_FILE"
            
            # 6. 合併內容並清理暫存檔
            cat temp.md >> "$MD_FILE"
            rm temp.md
          ' _ {} \;

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 GEO Optimization: Overwrite all MD from latest HTML"
          branch: main
          options: '--strategy-option theirs'   # 衝突時採用本地
